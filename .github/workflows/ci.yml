name: CI

on:
  push:
  pull_request:

jobs:
  node:
    name: Typecheck + gateway/API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5 # reads pnpm version from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages (ai-gateway, db) ship types/main from dist/, so
      # they must be built before apps can typecheck or run tests against them.
      - name: Build workspace packages
        run: pnpm --filter "./packages/*" build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (gateway + API)
        run: pnpm test

  mathcheck:
    name: SymPy mathcheck tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/mathcheck/requirements.txt

      - name: Install dependencies
        run: pip install -r services/mathcheck/requirements.txt pytest httpx

      - name: Test
        run: python -m pytest services/mathcheck
